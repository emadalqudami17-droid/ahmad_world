name: Build APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------
      # 1. Checkout
      # -----------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4


      # -----------------------------------------
      # 2. Setup Python for Buildozer
      # -----------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # -----------------------------------------
      # 3. Setup Java 17
      # -----------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # -----------------------------------------
      # 4. Install system dependencies
      # -----------------------------------------
      - name: Install System Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            sqlite3 \
            libbz2-dev \
            bzip2 \
            libreadline-dev \
            libgdbm-dev \
            libgdbm-compat-dev \
            ccache


      # -----------------------------------------
      # 5. Install Python build tools
      # -----------------------------------------
      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "buildozer" \
            "cython==0.29.36"


      # -----------------------------------------
      # 6. Check versions
      # -----------------------------------------
      - name: Check Build Environment
        run: |
          python --version
          pip --version
          buildozer --version
          cython --version
          java -version


      # -----------------------------------------
      # 7. Clean previous Buildozer files
      # -----------------------------------------
      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin


      # -----------------------------------------
      # 8. Build APK
      # -----------------------------------------
      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug


      # -----------------------------------------
      # 9. Upload APK
      # -----------------------------------------
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ahmed-world-apk
          path: bin/*.apk
