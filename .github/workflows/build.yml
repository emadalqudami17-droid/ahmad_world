name: Build APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Organize files into folders
        run: |
          mkdir -p images audio
          # Move all PNGs EXCEPT app_icon.png to images/
          for f in *.png; do
            if [ -f "$f" ] && [ "$f" != "app_icon.png" ]; then
              mv "$f" images/ 2>/dev/null || true
            fi
          done
          # Move all WAVs and MP3s to audio/
          mv *.wav audio/ 2>/dev/null || true
          mv *.mp3 audio/ 2>/dev/null || true
          echo "=== images ==="
          ls images/ 2>/dev/null | head -10 || echo "empty"
          echo "=== audio ==="
          ls audio/ 2>/dev/null | head -10 || echo "empty"
          echo "=== root (should contain app_icon.png) ==="
          ls *.png 2>/dev/null || echo "no png in root"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            build-essential \
            autoconf automake libtool libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev \
            ccache \
            liblzma-dev libbz2-dev libreadline-dev libsqlite3-dev \
            libgdbm-dev libnss3-dev uuid-dev

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer
          python -m pip install "cython<3.0.0"

      - name: Build APK
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          yes | buildozer -v android debug
        env:
          BUILDOZER_WARN_ON_ROOT: 0

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ahmed-world-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
