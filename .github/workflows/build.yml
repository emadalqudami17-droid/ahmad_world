name: Build APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install System Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            build-essential \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache

      - name: Verify Build Environment
        run: |
          echo "===== OS ====="
          cat /etc/os-release

          echo "===== Python ====="
          python --version

          echo "===== Autoconf ====="
          autoconf --version | head -n 1

          echo "===== Automake ====="
          automake --version | head -n 1

          echo "===== Libtool ====="
          libtool --version | head -n 1

          echo "===== Libtoolize ====="
          libtoolize --version | head -n 1

          echo "===== libltdl ====="
          dpkg -l | grep libltdl || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer
          python -m pip install "cython<3.0.0"
          python -m pip install kivy==2.3.0

      - name: Clean Previous Build Files
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ahmed-world-apk
          path: bin/*.apk
          if-no-files-found: error
